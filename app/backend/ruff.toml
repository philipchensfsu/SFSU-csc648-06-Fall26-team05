# Backend style: Google Python Style Guide (built on PEP 8), enforced by Ruff.
# Start with the rules that catch real bugs; widen them once the code is clean.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# pytest fixtures are imported and then "redefined" as test arguments.
"tests/**" = ["F811"]

[lint.pydocstyle]
convention = "google"
