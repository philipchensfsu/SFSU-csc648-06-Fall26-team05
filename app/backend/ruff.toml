# Backend style: Google Python Style Guide (built on PEP 8), enforced by Ruff.
# Start with the rules that catch real bugs; widen them once the code is clean.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# This file imports the cast/service pytest fixtures, which look "redefined" (F811) and unused (F401).
"tests/integration/test_ai_revision_db.py" = ["F401", "F811"]

[lint.pydocstyle]
convention = "google"

[format]
# Ruff's defaults: double quotes, 88-character lines (Black style).
quote-style = "double"
